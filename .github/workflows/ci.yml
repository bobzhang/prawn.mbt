name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: moon version --all

      - name: Fetch dependencies
        run: moon update

      - name: Format and interface check
        run: |
          moon fmt
          moon info
          git diff --exit-code

      # type-check, unit tests, and the comparison's self-test on the goldens
      - name: Check
        run: moon run --target native scripts/check.mbtx
